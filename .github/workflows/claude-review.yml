name: Claude PR Review

# Karya is maintained by one person. This job is the OPTIONAL automatic second
# reader. It does not approve or merge anything; it posts findings, and the
# merge decision stays human. See CLAUDE.md.
#
# Until a credential exists this job SKIPS rather than fails — a permanently red
# check is worse than no check, because it trains you to ignore red. The gate
# without it is CI plus a local `/code-review` pass posted to the PR; see
# CLAUDE.md. This is an upgrade, not a prerequisite.
#
# To turn it on, add ONE repository secret:
#   CLAUDE_CODE_OAUTH_TOKEN  — Pro/Max subscription; generate with
#                              `claude setup-token` (needs the claude CLI)
#   ANTHROPIC_API_KEY        — API billing account
# Or run `/install-github-app` from Claude Code in a terminal, which does it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip silently when no credential is configured.
    if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          # Whichever one is set; the action takes either.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the only reviewer this pull request will get. Act like it:
            be specific, be adversarial, and do not pad the review with praise
            or restatement of the diff.

            Read docs/orientation.md for how this repo is put together and
            docs/critical-review-2026-08.md for its known defects before you
            start. Do not re-report anything already documented there unless
            this PR makes it worse.

            ## The rule that matters most

            A finding you can REPRODUCE is a blocker. A finding you merely
            suspect is a question. Label every finding as one or the other, and
            never present the second as the first. If you can run something to
            check a claim, run it — `python3 -m unittest discover -s tests` is
            fast and needs no network. State plainly what you verified and what
            you only read.

            ## What this repo gets wrong, historically

            Weight your attention accordingly:

            1. **Silent degradation.** External tools (`git`, `gh`, `brew`,
               `bash`) are invoked by subprocess all over the codebase. Every
               call site must survive the tool being absent, unauthenticated,
               or rate-limited. Missing FileNotFoundError guards have shipped
               before.
            2. **Hooks must be idempotent.** Everything under
               templates/**/.karya/customizations/ re-runs on every
               `--continue` and on every sibling project creation. A hook that
               only works on a clean machine is broken.
            3. **Destructive or networked defaults.** Force pushes, `rm -rf`,
               repo creation, adopting a pre-existing remote, and anything that
               writes outside the workspace (especially into $HOME or a user's
               editor config) needs an explicit prompt or flag.
            4. **Dead mechanisms.** Code that writes a file, prints success,
               and is never executed by anything has shipped before. If a PR
               adds an integration point (a git hook, a marker field, a
               config), confirm something actually reads it.
            5. **Doc/code drift.** README.md, docs/design.md, docs/user-guide.md
               and .ai/README.md have each disagreed with bin/karya. If a PR
               changes behaviour, check whether it invalidates a doc.
            6. **Tests.** tests/test_karya.py is the only safety net. A
               behaviour change with no test is a finding. A fix that resolves
               an `@unittest.expectedFailure` must also delete the decorator.

            ## Out of scope

            Style, formatting, and naming preferences. The CLI is deliberately
            stdlib-only single-file Python — do not suggest adding
            dependencies, splitting it into a package, or introducing a
            framework unless the PR itself opens that question.

            Use inline comments for specific lines. Use one top-level comment
            for the verdict: what you verified, what is blocking, and what is
            merely worth thinking about.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(python3 -m unittest:*),Bash(bash -n:*),Bash(git log:*),Bash(git diff:*)"
